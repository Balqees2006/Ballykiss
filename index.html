<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div class="WeatherApp">
        <h1>Weather App</h1>
        <div class="search">
            <input type="text" placeholder="Enter City" id="input">
            <button id="search">Search</button>
        </div>
        <div class="weatherInfo">
            <h2 id="city">Lagos</h2>
            <div id="weatherIcon">☀️</div>
            <h3 id="degree">28°C</h3>
            <p id="sun">Sunny</p>
        </div>
        <div class="details">
            <div>
            <span id="icon">💧</span>
            <p id=>Humidity</p>
            <strong id="degree2">75%</strong>
            </div>
            <div>
                <span id="icon2">💨</span>
                <p>Wind</p>
                <strong id="kilometer">12 km/h</strong>
            </div>
        </div>
    </div>
    
    <script src="./index.js"></script>
</body>
</html>
